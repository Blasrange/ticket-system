<div class="app-layout" [class.sidebar-collapsed]="collapsed()">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i class="pi pi-headphones"></i>
      </div>
      <div class="brand-text">
        <span class="brand-name">Mesa WMS</span>
        <span class="brand-sub">Mesa de ayuda</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-group-label">Principal</span>

      <a class="nav-item" routerLink="/home" routerLinkActive="active" title="Dashboard">
        <span class="nav-icon"><i class="pi pi-home"></i></span>
        <span>Dashboard</span>
      </a>

      <a class="nav-item" routerLink="/tickets" routerLinkActive="active" title="Tickets">
        <span class="nav-icon"><i class="pi pi-ticket"></i></span>
        <span>Tickets</span>
      </a>

      <span class="nav-group-label">Administración</span>

      <a class="nav-item" routerLink="/agents" routerLinkActive="active" title="Agentes">
        <span class="nav-icon"><i class="pi pi-users"></i></span>
        <span>Agentes</span>
      </a>

      <a class="nav-item" routerLink="/reports" routerLinkActive="active" title="Reportes">
        <span class="nav-icon"><i class="pi pi-chart-bar"></i></span>
        <span>Reportes</span>
      </a>

      <a class="nav-item" routerLink="/settings" routerLinkActive="active" title="Configuración">
        <span class="nav-icon"><i class="pi pi-cog"></i></span>
        <span>Configuración</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" [title]="userName">
        <div class="user-avatar">{{ userInitial }}</div>
        <div class="user-meta">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">Agente</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </aside>

  <!-- ===== CONTENT AREA ===== -->
  <div class="content-area">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-breadcrumb">
        <!-- Botón toggle sidebar -->
        <button
          class="toggle-sidebar-btn"
          (click)="toggleSidebar()"
          [title]="collapsed() ? 'Expandir menú' : 'Contraer menú'"
        >
          <i class="pi" [class.pi-bars]="collapsed()" [class.pi-chevron-left]="!collapsed()"></i>
        </button>
        <i class="pi pi-home breadcrumb-icon"></i>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">{{ pageTitle() }}</span>
      </div>
      <div class="topbar-actions">
        <button class="topbar-icon-btn" title="Notificaciones">
          <i class="pi pi-bell"></i>
          <span class="notif-dot"></span>
        </button>
        <div class="topbar-user">
          <div class="topbar-avatar">{{ userInitial }}</div>
          <span class="topbar-username">{{ userName }}</span>
          <i class="pi pi-angle-down" style="font-size: 0.75rem; color: #94a3b8"></i>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
