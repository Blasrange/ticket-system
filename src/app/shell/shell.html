<div class="app-layout">
  <!-- ===== TOP NAVBAR ===== -->
  <header class="top-navbar">

    <!-- Lado Izquierdo: Logo y Dropdowns -->
    <div class="nav-left">
      <!-- Brand / Logo -->
      <div class="brand">
        <div class="brand-icon">
          <i class="pi pi-headphones"></i>
        </div>
        <div class="brand-text">
          <span class="brand-name">Mesa Aplicaciones</span>
          <span class="brand-sub">Mesa de ayuda</span>
        </div>
      </div>

      <!-- Menús Desplegables -->
      <div class="nav-menu">

        <!-- Dropdown: Operaciones -->
        <div class="dropdown-wrapper">
          <button class="dropdown-trigger" [class.active]="activeDropdown === 'operaciones'"
            (click)="toggleDropdown('operaciones', $event)">
            <i class="pi pi-chart-line"></i>
            <span>Operaciones</span>
            <i class="pi pi-chevron-down arrow"></i>
          </button>

          <div class="dropdown-menu" *ngIf="activeDropdown === 'operaciones'">
            <!-- <a routerLink="/home" routerLinkActive="active" class="dropdown-item">
              <i class="pi pi-home"></i> Dashboard
            </a> -->
            <a routerLink="/kanban-board" routerLinkActive="active" class="dropdown-item">
              <i class="pi pi-th-large"></i> Tablero Kanban
            </a>
          </div>
        </div>

        <!-- Dropdown: Gestión -->
        <div class="dropdown-wrapper">
          <button class="dropdown-trigger" [class.active]="activeDropdown === 'gestion'"
            (click)="toggleDropdown('gestion', $event)">
            <i class="pi pi-briefcase"></i>
            <span>Gestión</span>
            <i class="pi pi-chevron-down arrow"></i>
          </button>

          <div class="dropdown-menu" *ngIf="activeDropdown === 'gestion'">
            <a routerLink="/tickets" routerLinkActive="active" class="dropdown-item">
              <i class="pi pi-ticket"></i> Tickets
            </a>
            <a routerLink="/agents" routerLinkActive="active" class="dropdown-item">
              <i class="pi pi-users"></i> Agentes
            </a>
          </div>
        </div>

      </div>
    </div>

    <!-- Lado Derecho: Acciones Globales -->
    <div class="nav-right">
      <app-notification-bell></app-notification-bell>
      <div class="topbar-divider"></div>
      <div class="user-badge" [title]="userName + ' - ' + userRole">
        <div class="user-avatar">{{ userInitial }}</div>
        <span class="user-role-badge">{{ userRole }}</span>
      </div>
      <button class="nav-icon-btn logout-btn" (click)="logout()" title="Cerrar sesión">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </header>

  <!-- ===== CONTENT AREA ===== -->
  <main class="page-content">
    <!-- Breadcrumb (Migas de pan justo encima de las tablas) -->
    <div class="breadcrumb-wrapper">
      <p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
    </div>

    <router-outlet></router-outlet>
  </main>
</div>
